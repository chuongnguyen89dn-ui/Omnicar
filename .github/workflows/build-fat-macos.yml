# build-fat-macos.yml — FAT (arm64 + arm64e) build of the recovered
# OmniCar 1.0.3 source on a real macOS runner.
#
# Why this exists: the analysis VM's Ubuntu clang-18 silently
# degrades arm64e to arm64, so the locally built package is
# arm64-only (gap G1 in handover/RECOVERY_STATUS.md). The original
# 1.0.3 binaries are FAT arm64+arm64e, produced by Theos/Xcode on
# macOS. This workflow builds the same recovered source with
# ARCHS="arm64 arm64e" and FAILS unless the produced binaries
# actually contain both slices — the FAT claim is tested, not
# assumed.
#
# Placement: this file lives under ci/ in the recovered-source
# folder; copy it to .github/workflows/build-fat-macos.yml at the
# REPOSITORY ROOT for GitHub Actions to pick it up (Actions only
# reads .github/workflows/ at the root).
#
# Triggers: manual (workflow_dispatch) and pushes to the
# ci-fat-test branch.
name: build-fat-macos

on:
  workflow_dispatch:
  push:
    branches:
      - ci-fat-test

jobs:
  build-fat:
    runs-on: macos-15
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Install Theos
        run: |
          git clone --recursive https://github.com/theos/theos.git ~/theos
          # Sparse-checkout just the iPhoneOS 16.5 SDK from theos/sdks.
          git clone --depth 1 --filter=blob:none --sparse https://github.com/theos/sdks.git ~/theos-sdks
          git -C ~/theos-sdks sparse-checkout set iPhoneOS16.5.sdk
          mkdir -p ~/theos/sdks
          cp -R ~/theos-sdks/iPhoneOS16.5.sdk ~/theos/sdks/
          ls ~/theos/sdks

      - name: Install ldid and dpkg
        run: brew install ldid dpkg

      # The project Makefiles carry -fuse-ld=lld in their LDFLAGS:
      # that flag is a workaround for the Ubuntu analysis VM (whose
      # default linker is GNU ld). Xcode's clang rejects it
      # ("invalid linker name in argument '-fuse-ld=lld'", FAT run
      # #2, 2026-11-08). On macOS the flag is unnecessary — the
      # default ld64 is correct — so strip it in the CI checkout
      # only; the shipped tree keeps it for the Linux build path.
      - name: macOS adjustments (drop the Linux-only -fuse-ld=lld flag)
        run: |
          grep -rl 'fuse-ld=lld' recovered-source/project --include='Makefile' | while read -r f; do
            sed -i '' 's/-fuse-ld=lld//g' "$f"
            echo "patched: $f"
          done
          echo "remaining fuse-ld mentions in Makefiles: $(grep -r 'fuse-ld' recovered-source/project --include='Makefile' | wc -l)"

      # The project Makefiles assign ARCHS = arm64 (plain "="), so a
      # make command-line variable overrides them; ARCHS is also
      # exported in the environment for any sub-make that reads it.
      # This dry-run step logs evidence of which architectures the
      # build system will actually use before the real build runs.
      - name: Show the architectures the build will use
        working-directory: recovered-source/project
        env:
          ARCHS: "arm64 arm64e"
        run: |
          export THEOS=~/theos
          make -n package FINALPACKAGE=1 ARCHS="arm64 arm64e" > /tmp/make-dryrun.txt 2>&1 || true
          echo "arm64e mentions in dry run: $(grep -c arm64e /tmp/make-dryrun.txt || true)"
          grep -m 3 arm64e /tmp/make-dryrun.txt || echo "WARNING: no arm64e found in dry run"

      - name: Run HL8 analyzer regression fixtures
        working-directory: recovered-source/gpt-project-history
        run: python3 -m unittest -v test_analyze_hl8_unified_log.py

      - name: Build the package (arm64 + arm64e)
        working-directory: recovered-source/project
        env:
          ARCHS: "arm64 arm64e"
        run: |
          export THEOS=~/theos
          make clean
          make package FINALPACKAGE=1 ARCHS="arm64 arm64e"
          ls -la packages/

      # Acceptance: the 6 dylibs, the Prefs bundle binary and OmniCar.app inside
      # the produced .deb must each be FAT with exactly the arm64 and
      # arm64e slices, including the iPhone app identity binary.
      - name: Verify FAT slices in the component binaries
        run: |
          VER=$(sed -n 's/^Version:[[:space:]]*//p' recovered-source/project/control | head -1)
          DEB=recovered-source/project/packages/com.anlai.omnicar_${VER}_iphoneos-arm64.deb
          ls -la "$DEB"
          rm -rf /tmp/fatcheck && mkdir -p /tmp/fatcheck
          dpkg-deb -x "$DEB" /tmp/fatcheck
          ROOT=/tmp/fatcheck/var/jb
          FAIL=0
          for f in \
            Library/MobileSubstrate/DynamicLibraries/OmniCarCore.dylib \
            Library/MobileSubstrate/DynamicLibraries/OmniCarAppBridge.dylib \
            Library/MobileSubstrate/DynamicLibraries/OmniCarCarProbe.dylib \
            Library/MobileSubstrate/DynamicLibraries/OmniCarSpeedBubble.dylib \
            Library/MobileSubstrate/DynamicLibraries/OmniCarSplitScreen.dylib \
            Library/MobileSubstrate/DynamicLibraries/OmniCarStartupScreen.dylib \
            Library/PreferenceBundles/OmniCarPrefs.bundle/OmniCarPrefs \
            Applications/OmniCar.app/OmniCar ; do
            INFO=$(lipo -info "$ROOT/$f")
            echo "$f -> $INFO"
            case "$INFO" in
              *"arm64 arm64e"*|*"arm64e arm64"*) : ;;
              *) echo "::error::$f is not FAT arm64+arm64e"; FAIL=1 ;;
            esac
          done
          echo "App binary (informational): $(lipo -info "$ROOT/Applications/OmniCar.app/OmniCar")"
          if [ "$FAIL" -ne 0 ]; then
            echo "::error::FAT verification failed"
            exit 1
          fi
          echo "All eight required binaries are FAT (arm64 + arm64e)."

      - name: Verify HL19 native keyboard, legacy picker, and HL8-HL18 regressions
        run: |
          DEB=recovered-source/project/packages/com.anlai.omnicar_1.0.3-hl19nativeprefs_iphoneos-arm64.deb
          test "$(dpkg-deb -f "$DEB" Package)" = "com.anlai.omnicar"
          test "$(dpkg-deb -f "$DEB" Version)" = "1.0.3-hl19nativeprefs"
          echo "HL19 package: $(dpkg-deb -f "$DEB" Package Version Architecture)"
          shasum -a 256 "$DEB"
          ROOT=/tmp/fatcheck/var/jb/Library/MobileSubstrate/DynamicLibraries
          for dylib in OmniCarSplitScreen OmniCarAppBridge; do
            for arch in arm64 arm64e; do
              THIN="/tmp/hl8-${dylib}-${arch}"
              lipo -thin "$arch" "$ROOT/${dylib}.dylib" -output "$THIN"
              if ! strings "$THIN" | grep -Fq '[hl8diag]'; then
                echo "::error::Missing HL8 marker in $dylib/$arch"
                exit 1
              fi
              echo "HL8 marker PASS $dylib/$arch"
              if [ "$dylib" = "OmniCarAppBridge" ]; then
                # HL19 intentionally restores the HL11 native UIWindow path.
                # A static YES gate makes deprecated HL14/15/16/18 keyboard
                # geometry branches dead under release optimization; absence
                # of their strings is expected, not a functional regression.
                # Check the active native fit plus unchanged hosted pinch.
                for marker in '[hl11kb]' '[hl19kb] mode=hl11-native-frame' '[pinch2] trigger=began toggle-sent dir=0'; do
                  if ! strings "$THIN" | grep -F "$marker" >/dev/null; then
                    echo "::error::HL19 active keyboard/pinch marker $marker missing in $dylib/$arch"
                    exit 1
                  fi
                  echo "HL19 keyboard/pinch marker PASS $dylib/$arch: $marker"
                done
              fi
              if [ "$dylib" = "OmniCarSplitScreen" ]; then
                for marker in '[hl13pinch]' 'route=inapp-hosted' 'hostedPinchFallback' '[hl14-picker]' '[hl15-picker]' '[hl16-picker] ev=sheet-geometry' '[hl16-picker] ev=owner-switch' '[hl17-picker] layout=' '[hl17-picker] ev=bar-dismiss action=ignore-picker-open' '[hl18-picker] ev=bar-dismiss action=ignore-picker-queued' '[hl14-floating]' 'dock-hosted-readback' 'dock-category' 'dock-readback' 'dock-tap' 'dock-lifecycle' 'active-model' 'dock-category-not-other'; do
                  if ! strings "$THIN" | grep -F "$marker" >/dev/null; then
                    echo "::error::HL12/HL13/HL14 marker $marker missing in $dylib/$arch"
                    exit 1
                  fi
                  echo "HL12/HL13/HL14 marker PASS $dylib/$arch: $marker"
                done
                for marker in 'native-logo-owned' 'fs-hidden-save' 'fs-hidden-restore' 'ev=picker-host' 'ev=shield-host'; do
                  if ! strings "$THIN" | grep -F "$marker" >/dev/null; then
                    echo "::error::SplitScreen marker $marker missing in $dylib/$arch"
                    exit 1
                  fi
                  echo "HL9 logo marker PASS $dylib/$arch: $marker"
                done
              fi
            done
          done

      - name: Verify HL19 embedded Settings and original iPhone app identity
        run: |
          ROOT=/tmp/fatcheck/var/jb
          APP="$ROOT/Applications/OmniCar.app/OmniCar"
          PREFS="$ROOT/Library/PreferenceBundles/OmniCarPrefs.bundle/OmniCarPrefs"
          test -f "$APP" && test -f "$PREFS"
          # [hl16b-appinfo] Previous HL16 CI was green with a .prefs
          # Info.plist in the iPhone app. Reject such packages, even if
          # all Mach-O files and resources are signed and present.
          python3 - <<'PYCHECK'
          import plistlib
          from pathlib import Path
          root = Path("/tmp/fatcheck/var/jb")
          app = root / "Applications/OmniCar.app"
          prefs = root / "Library/PreferenceBundles/OmniCarPrefs.bundle"
          def load(path):
              with path.open("rb") as file:
                  return plistlib.load(file)
          a = load(app / "Info.plist")
          p = load(prefs / "Info.plist")
          original = load(Path("recovered-source/project/OmniCarApp/Resources/Info.plist"))
          required = {
              "CFBundleIdentifier": "com.anlai.omnicar.app",
              "CFBundleExecutable": "OmniCar",
              "CFBundlePackageType": "APPL",
              "LSRequiresIPhoneOS": True,
          }
          for key, value in required.items():
              assert a.get(key) == value, f"Invalid OmniCar.app {key}: {a.get(key)!r}"
              assert original.get(key) == value, f"Source app Info.plist mismatch {key}"
          assert (app / a["CFBundleExecutable"]).is_file(), "Missing iPhone app executable"
          schemes = [
              s for typ in a.get("CFBundleURLTypes", [])
              for s in typ.get("CFBundleURLSchemes", [])
          ]
          assert "omnicar" in schemes, f"Lost omnicar:// URL scheme: {schemes}"
          assert p.get("CFBundleIdentifier") == "com.anlai.omnicar.prefs"
          assert p.get("CFBundlePackageType") == "BNDL"
          assert p.get("CFBundleExecutable") == "OmniCarPrefs"
          print("HL16b App Identity PASS: actual iPhone app, own CarPlay Home bundle ID, URL scheme")
          PYCHECK
          test ! -e "$ROOT/Library/PreferenceLoader/Preferences/OmniCarPrefs.plist"
          if ! strings "$APP" | grep -F '[hl19-settings] gate=embedded-preferences-ready' >/dev/null; then
            echo "::error::HL19 in-app Settings controller marker absent"
            exit 1
          fi
          if ! strings "$APP" | grep -F 'OMCRootListController' >/dev/null; then
            echo "::error::OmniCar is not loading the existing Prefs root"
            exit 1
          fi
          for res in Root.plist FeatureSplitScreen.plist FeatureStartupScreen.plist FeatureSpeedBubble.plist; do
            test -e "$ROOT/Library/PreferenceBundles/OmniCarPrefs.bundle/$res" || {
              echo "::error::Missing original Prefs resource $res"; exit 1;
            }
            test -e "$ROOT/Applications/OmniCar.app/$res" || {
              echo "::error::HL16 iPhone app missing embedded resource $res"; exit 1;
            }
          done
          for marker in 'OMCSplitScreenController' 'OMCAppBridgeAppsController' 'OMCStartupScreenController' 'OMCSpeedBubbleController'; do
            if ! strings "$APP" | grep -F "$marker" >/dev/null; then
              echo "::error::HL16 iPhone app missing controller $marker"; exit 1;
            fi
          done
          # Root navigation is embedded in the actual iPhone app, not just
          # the Prefs dylib; the real controller selection remains dynamic.
          strings "$APP" | grep -F 'OMCEmbeddedPrefsRootController' >/dev/null || {
            echo "::error::HL19 embedded root navigation class missing"; exit 1;
          }
          echo "HL19 in-app Settings, navigation markers and resources PASS"

      - name: Upload the FAT deb
        uses: actions/upload-artifact@v4
        with:
          name: omnicar-hl19nativeprefs-fat-deb
          path: recovered-source/project/packages/com.anlai.omnicar_1.0.3-hl19nativeprefs_iphoneos-arm64.deb
