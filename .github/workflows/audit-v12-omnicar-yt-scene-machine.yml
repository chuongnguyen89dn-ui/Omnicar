name: Audit original Native12 vs OmniCar YouTube scene machine code (NO DEB)
on:
  push:
    branches: [main]
    paths:
      - scripts/audit_v12_omnicar_geometry_machine.py
      - scripts/audit_v12_omnicar_scene_calls.py
      - scripts/audit_omnicar_sbscene_reference_hook.py
      - scripts/audit_omnicar_layout_geometry_policy.py
      - scripts/audit_omnicar_scene_private_selectors.py
      - scripts/audit_omnicar_scene_settings_block.py
      - .github/workflows/audit-v12-omnicar-yt-scene-machine.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: omnicar-v12-yt-readonly-audit
  cancel-in-progress: false
jobs:
  native12-geometry:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout OmniCar (actual project)
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Checkout pinned DuoFace original Native12 reference (read-only)
        uses: actions/checkout@v4
        with:
          repository: chuongnguyen89dn-ui/Duoface
          ref: 6193b9e77337fd1e9d586da5e5bf39742d041d2d
          path: duoface-reference
          persist-credentials: false
      - name: Verify exact source package and install disassembly library
        shell: bash
        run: |
          set -euo pipefail
          test -s com.anlai.omnicar_1.0.3_iphoneos-arm64.deb
          test -s duoface-reference/dist/visual-1.0.3-12/com.duoface.app_1.0.3-12_visualtest_iphoneos-arm64.deb
          echo 'd9297b010cdc08e401439b7332413f79cb1a056a05159a5deb673e218d76d9fd  com.anlai.omnicar_1.0.3_iphoneos-arm64.deb' | sha256sum -c -
          echo '8b7dedf77b9ec05465b83fdb6e2d7127800eac232a34ecf12f2c08b3983a481a  duoface-reference/dist/visual-1.0.3-12/com.duoface.app_1.0.3-12_visualtest_iphoneos-arm64.deb' | sha256sum -c -
          python3 -m venv "$RUNNER_TEMP/v12-geometry-venv"
          "$RUNNER_TEMP/v12-geometry-venv/bin/python" -m pip install capstone==5.0.7
          "$RUNNER_TEMP/v12-geometry-venv/bin/python" -m py_compile scripts/audit_v12_omnicar_geometry_machine.py scripts/audit_v12_omnicar_scene_calls.py scripts/audit_omnicar_sbscene_reference_hook.py scripts/audit_omnicar_layout_geometry_policy.py scripts/audit_omnicar_scene_private_selectors.py scripts/audit_omnicar_scene_settings_block.py
      - name: Disassemble original per-app native/referenceSize flows without modifying either package
        shell: bash
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/v12-geometry-venv/bin/python" scripts/audit_v12_omnicar_geometry_machine.py \
            --duoface duoface-reference/dist/visual-1.0.3-12/com.duoface.app_1.0.3-12_visualtest_iphoneos-arm64.deb \
            --omnicar com.anlai.omnicar_1.0.3_iphoneos-arm64.deb \
            --output audit/native12_vs_omnicar_yt_scene_arm64_20261023.json | tee "$RUNNER_TEMP/scene-fp-evidence.log"
          grep -q 'NATIVE12_OMNICAR_ORIGINAL_SHA_PINNED_MACHINE_CODE_AUDIT_PASS__DEVICE_UNTESTED' "$RUNNER_TEMP/scene-fp-evidence.log"
          python3 - <<'PY'
          import json
          d=json.load(open('audit/native12_vs_omnicar_yt_scene_arm64_20261023.json'))
          assert len(d['duoface']) == 7 and len(d['omnicar']) == 4
          assert all(x['instruction_count'] == len(x['full_disassembly'])
                     for group in ('duoface','omnicar') for x in d[group].values())
          assert 'DEVICE_UNTESTED' in d['status']
          print('NATIVE12_OMNI_MACHINE_AUDIT_JSON_INTEGRITY_PASS')
          PY
      - name: Map imported ObjC selector calls to scene/referenceSize code (read-only)
        shell: bash
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/v12-geometry-venv/bin/python" scripts/audit_v12_omnicar_scene_calls.py \
            --duoface duoface-reference/dist/visual-1.0.3-12/com.duoface.app_1.0.3-12_visualtest_iphoneos-arm64.deb \
            --omnicar com.anlai.omnicar_1.0.3_iphoneos-arm64.deb \
            --output audit/native12_vs_omnicar_scene_selector_calls_20261023.json | tee "$RUNNER_TEMP/scene-selector-evidence.log"
          grep -q 'NATIVE12_OMNI_SHA_LOCKED_SELECTOR_CALLSITE_STATIC_AUDIT_PASS__DEVICE_UNTESTED' "$RUNNER_TEMP/scene-selector-evidence.log"
          python3 - <<'PY'
          import json
          p='audit/native12_vs_omnicar_scene_selector_calls_20261023.json'
          d=json.load(open(p))
          assert len(d['duoface']['methods'])==7 and len(d['omnicar']['methods'])==4
          assert all(len(m['all_calls'])==m['call_count']
                     for side in ('duoface','omnicar') for m in d[side]['methods'].values())
          print('NATIVE12_OMNI_SELECTOR_MAP_JSON_INTEGRITY_PASS')
          PY
      - name: Resolve SBSceneView reference-size selector/class static hook xrefs (no changes)
        shell: bash
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/v12-geometry-venv/bin/python" scripts/audit_omnicar_sbscene_reference_hook.py \
            --omnicar com.anlai.omnicar_1.0.3_iphoneos-arm64.deb \
            --output audit/omnicar_original_sbscene_reference_hook_20261023.json | tee "$RUNNER_TEMP/sbscene-xref-evidence.log"
          grep -q 'OMNICAR_SHA_LOCKED_SBSCENE_REFERENCE_STATIC_AUDIT_PASS__DEVICE_UNTESTED' "$RUNNER_TEMP/sbscene-xref-evidence.log"
          python3 - <<'PY'
          import json
          p='audit/omnicar_original_sbscene_reference_hook_20261023.json'
          d=json.load(open(p))
          assert d['status'].endswith('DEVICE_UNTESTED')
          assert any(x['needle']=='_updateReferenceSize:andOrientation:'
                     for x in d['reference_size_strings'])
          assert isinstance(d['class_or_selector_address_references'],list)
          print('OMNICAR_SBSCENE_XREF_REPORT_INTEGRITY_PASS')
          PY
      - name: Verify exact bounds vs logical frame vs sceneBox Native12 comparison
        shell: bash
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/v12-geometry-venv/bin/python" scripts/audit_omnicar_layout_geometry_policy.py \
            --duoface duoface-reference/dist/visual-1.0.3-12/com.duoface.app_1.0.3-12_visualtest_iphoneos-arm64.deb \
            --omnicar com.anlai.omnicar_1.0.3_iphoneos-arm64.deb \
            --output audit/omnicar_native12_verified_layout_policy_20261023.json | tee "$RUNNER_TEMP/layout-policy-evidence.log"
          grep -q 'OMNICAR_NATIVE12_SHA_PINNED_GEOMETRY_INVARIANTS_PASS__DEVICE_UNTESTED' "$RUNNER_TEMP/layout-policy-evidence.log"
          python3 - <<'PY'
          import json
          d=json.load(open('audit/omnicar_native12_verified_layout_policy_20261023.json'))
          assert 'DEVICE_UNTESTED' in d['status']
          assert len(d['omnicar'])==3 and len(d['duoface'])==4
          assert all(v['anchor_count']==len(v['verified_anchors'])
                     for side in ('duoface','omnicar') for v in d[side].values())
          print('OMNICAR_NATIVE12_LAYOUT_POLICY_JSON_INTEGRITY_PASS')
          PY
      - name: Decode exact private scene selector CFStrings used by ABHost layout (read-only)
        shell: bash
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/v12-geometry-venv/bin/python" scripts/audit_omnicar_scene_private_selectors.py \
            --omnicar com.anlai.omnicar_1.0.3_iphoneos-arm64.deb \
            --output audit/omnicar_original_private_scene_selectors_20261023.json | tee "$RUNNER_TEMP/private-scene-selectors.log"
          grep -q 'OMNICAR_SHA_PINNED_PRIVATE_SCENE_SELECTOR_MAP_PASS__DEVICE_UNTESTED' "$RUNNER_TEMP/private-scene-selectors.log"
          python3 - <<'PY'
          import json
          d=json.load(open('audit/omnicar_original_private_scene_selectors_20261023.json'))
          assert len(d['original_cfstrings_and_dynamic_selectors'])==3
          assert len(d['all_NSSelectorFromString_calls'])==3
          assert all(x['decoded_exact_selector'] for x in d['original_cfstrings_and_dynamic_selectors'])
          print('OMNICAR_PRIVATE_SCENE_SELECTOR_JSON_INTEGRITY_PASS')
          PY
      - name: Trace original AppBridge updateSettingsWithBlock payload and block (read-only)
        shell: bash
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/v12-geometry-venv/bin/python" scripts/audit_omnicar_scene_settings_block.py \
            --omnicar com.anlai.omnicar_1.0.3_iphoneos-arm64.deb \
            --output audit/omnicar_original_scene_settings_block_20261023.json | tee "$RUNNER_TEMP/scene-block.log"
          grep -q 'OMNICAR_SCENE_SETTINGS_BLOCK_SHA_PINNED_STATIC_PASS__DEVICE_UNTESTED' "$RUNNER_TEMP/scene-block.log"
          python3 - <<'PY'
          import json
          d=json.load(open('audit/omnicar_original_scene_settings_block_20261023.json'))
          assert d['receiver_private_selector']=='updateSettingsWithBlock:'
          assert d['invoke_function_pc']=='0xf210'
          assert [x['decoded_exact_selector'] for x in d['exact_private_settings_selectors']] == [
            'setFrame:', 'setInterfaceOrientation:', 'setBackgrounded:', 'setForeground:']
          assert len(d['bounded_block_instructions'])>0
          print('OMNICAR_SCENE_SETTINGS_BLOCK_INTEGRITY_PASS')
          PY
      - name: Archive verified disassembly under OmniCar audit (never modify DuoFace or QA12)
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- audit/native12_vs_omnicar_yt_scene_arm64_20261023.json audit/native12_vs_omnicar_scene_selector_calls_20261023.json audit/omnicar_original_sbscene_reference_hook_20261023.json audit/omnicar_native12_verified_layout_policy_20261023.json audit/omnicar_original_private_scene_selectors_20261023.json audit/omnicar_original_scene_settings_block_20261023.json
          if git diff --cached --quiet; then
            echo 'READONLY_AUDIT_REPORT_ALREADY_ARCHIVED'
          else
            git commit -m 'audit: archive SHA-locked Native12 versus OmniCar scene disassembly [skip ci]'
            git push origin HEAD:main
            echo 'READONLY_AUDIT_REPORT_COMMITTED_TO_OMNICAR'
          fi
      - name: Upload exact static analysis report and stdout (not an installable DEB)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: omnicar-v12-yt-static-geometry
          path: |
            audit/native12_vs_omnicar_yt_scene_arm64_20261023.json
            audit/native12_vs_omnicar_scene_selector_calls_20261023.json
            audit/omnicar_original_sbscene_reference_hook_20261023.json
            audit/omnicar_native12_verified_layout_policy_20261023.json
            audit/omnicar_original_private_scene_selectors_20261023.json
            audit/omnicar_original_scene_settings_block_20261023.json
          if-no-files-found: warn
