name: READONLY AppBridge zoom and app-layout comparison (NO DEB)
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/audit-appbridge-zoom-comparison.yml"
      - "scripts/audit_appbridge_zoom_comparison.py"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  original-forensic:
    runs-on: macos-15
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - name: Verify three matching shared skill ZIP archives
        shell: bash
        run: |
          set -euo pipefail
          for name in 01-github-continuity 02-ios-deb-ipa-carplay 05-research-debug-testing; do
            curl -fLsS --retry 3 "https://raw.githubusercontent.com/chuongnguyen89dn-ui/Gpt-training-/main/skills/$name.zip" -o "$RUNNER_TEMP/$name.zip"
            unzip -t "$RUNNER_TEMP/$name.zip" >/dev/null
            echo "SKILL_ARCHIVE_CONTENTS=$name"
            unzip -Z -1 "$RUNNER_TEMP/$name.zip" | head -n 30
          done
      - name: Install native static-analysis tools
        run: |
          brew install dpkg llvm
          echo "/opt/homebrew/opt/llvm/bin" >> "$GITHUB_PATH"
      - name: Examine original 1.0.3 DEB, not installed apps
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/audit_appbridge_zoom_comparison.py \
            com.anlai.omnicar_1.0.3_iphoneos-arm64.deb \
            --out audit/OmniCar_AppBridge_global_zoom_compare_20261020.json
          test -s audit/OmniCar_AppBridge_global_zoom_compare_20261020.json
      - uses: actions/upload-artifact@v4
        with:
          name: OmniCar-Original-GlobalZoom-ReadOnly-App-Comparison
          path: audit/OmniCar_AppBridge_global_zoom_compare_20261020.json
          retention-days: 90
      - name: Save evidence to Omnicar repo only, safely rebase concurrent handoffs
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add audit/OmniCar_AppBridge_global_zoom_compare_20261020.json
          git diff --cached --quiet && exit 0
          git commit -m 'audit(appbridge): store exact original global zoom comparison [skip ci]'
          for attempt in 1 2 3; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then exit 0; fi
            sleep 2
          done
          exit 1
