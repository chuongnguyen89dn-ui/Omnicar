name: Readonly DuoFace external SOLO host-menu comparison with OmniCar
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/audit-duoface-external-solo-menu.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  audit-menu-owner:
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Install read-only artifact analysis tools
        shell: bash
        run: |
          set -euo pipefail
          brew install dpkg
          python3 -m pip install --break-system-packages 'capstone==5.0.7'
      - name: Read and pin historical DuoFace v12 original DASHBOARD binary (no changes to DuoFace)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p audit/duoface-external-solo
          ROOT="https://raw.githubusercontent.com/chuongnguyen89dn-ui/Duoface/8ac3d5080b067a7462a106d4410fe5547f9bbc8c"
          curl -fLsS --retry 4 "$ROOT/dist/visual-1.0.3-12/com.duoface.app_1.0.3-12_visualtest_iphoneos-arm64.deb" -o "$RUNNER_TEMP/duoface-v12.deb"
          mkdir -p "$RUNNER_TEMP/v12-deb"
          dpkg-deb -x "$RUNNER_TEMP/duoface-v12.deb" "$RUNNER_TEMP/v12-deb"
          find "$RUNNER_TEMP/v12-deb" -name 'DuoFaceDashboard.dylib'
          DASH="$(find "$RUNNER_TEMP/v12-deb" -name 'DuoFaceDashboard.dylib' | head -n1)"
          test -s "$DASH"
          printf '%s  %s\n' "bc1df854ec7a2ddfeec4cb81b080ead34b54df80143d4a8f6254bb8b618003ce" "$DASH" | shasum -a 256 --check
          curl -fLsS --retry 4 "$ROOT/scripts/v12_host_recovery.py" -o "$RUNNER_TEMP/v12_host_recovery.py"
          # Only source-parses and disassembles. Never executes native artifact code.
          python3 "$RUNNER_TEMP/v12_host_recovery.py" "$DASH" \
            0xb1064:0xb1d98 0xb1d98:0xb1ec0 0xb25e4:0xb2694 \
            0x27fee4:0x280014 > audit/duoface-external-solo/CBWindow_multitasking_pill_and_picker.txt
          python3 - <<'PY'
          from pathlib import Path
          p=Path('audit/duoface-external-solo/CBWindow_multitasking_pill_and_picker.txt')
          text=p.read_text()
          assert 'IVAR CBWindow._multitaskingPill offset 0x38' in text
          assert '-[CBWindow createWindows] IMP 0xb1064' in text
          assert '-[CBWindow showAppPickerForSlot:] IMP 0xb25e4' in text
          assert '-[CBBridgeManager showAppPickerForSlot:] IMP 0x27fee4' in text
          assert 'SEL showAppPickerForSlot:' in text
          print('DUOFACE_NATIVE12_HOST_WINDOW_PILL_AND_MENU_CALL_CHAIN_STATIC_PASS')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: DuoFace-original-external-SOLO-menu-static-readonly
          path: audit/duoface-external-solo/CBWindow_multitasking_pill_and_picker.txt
          retention-days: 90
      - name: Save DuoFace comparison as OmniCar project reference ONLY
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add audit/duoface-external-solo/CBWindow_multitasking_pill_and_picker.txt
          git diff --cached --quiet && exit 0
          git commit -m 'audit: pin original DuoFace host-level SOLO menu call chain for OmniCar [skip ci]'
          for i in 1 2 3; do
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main && exit 0
            sleep 2
          done
          exit 1
