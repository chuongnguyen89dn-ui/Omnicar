# build-fat-macos.yml — FAT (arm64 + arm64e) build of the recovered
# DuoCar 1.0.3 source on a real macOS runner.
#
# Why this exists: the analysis VM's Ubuntu clang-18 silently
# degrades arm64e to arm64, so the locally built package is
# arm64-only (gap G1 in handover/RECOVERY_STATUS.md). The original
# 1.0.3 binaries are FAT arm64+arm64e, produced by Theos/Xcode on
# macOS. This workflow builds the same recovered source with
# ARCHS="arm64 arm64e" and FAILS unless the produced binaries
# actually contain both slices — the FAT claim is tested, not
# assumed.
#
# Placement: this file lives under ci/ in the recovered-source
# folder; copy it to .github/workflows/build-fat-macos.yml at the
# REPOSITORY ROOT for GitHub Actions to pick it up (Actions only
# reads .github/workflows/ at the root).
#
# Triggers: manual (workflow_dispatch) and pushes to the
# ci-fat-test branch.
name: build-fat-macos

permissions:
  contents: write

on:
  workflow_dispatch:
  push:
    branches:
      - ci-fat-test
      - feature/duocar-hl21-rebrand-20261111
      - feature/duocar-hl22-keyplane-menu-original-20261111
      - feature/duocar-hl23-keyboard-physical-contract-20261111

jobs:
  build-fat:
    runs-on: macos-15
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Install Theos
        run: |
          git clone --recursive https://github.com/theos/theos.git ~/theos
          # Sparse-checkout just the iPhoneOS 16.5 SDK from theos/sdks.
          git clone --depth 1 --filter=blob:none --sparse https://github.com/theos/sdks.git ~/theos-sdks
          git -C ~/theos-sdks sparse-checkout set iPhoneOS16.5.sdk
          mkdir -p ~/theos/sdks
          cp -R ~/theos-sdks/iPhoneOS16.5.sdk ~/theos/sdks/
          ls ~/theos/sdks

      - name: Install ldid and dpkg
        run: brew install ldid dpkg

      # The project Makefiles carry -fuse-ld=lld in their LDFLAGS:
      # that flag is a workaround for the Ubuntu analysis VM (whose
      # default linker is GNU ld). Xcode's clang rejects it
      # ("invalid linker name in argument '-fuse-ld=lld'", FAT run
      # #2, 2026-11-08). On macOS the flag is unnecessary — the
      # default ld64 is correct — so strip it in the CI checkout
      # only; the shipped tree keeps it for the Linux build path.
      - name: macOS adjustments (drop the Linux-only -fuse-ld=lld flag)
        run: |
          grep -rl 'fuse-ld=lld' recovered-source/project --include='Makefile' | while read -r f; do
            sed -i '' 's/-fuse-ld=lld//g' "$f"
            echo "patched: $f"
          done
          echo "remaining fuse-ld mentions in Makefiles: $(grep -r 'fuse-ld' recovered-source/project --include='Makefile' | wc -l)"

      # The project Makefiles assign ARCHS = arm64 (plain "="), so a
      # make command-line variable overrides them; ARCHS is also
      # exported in the environment for any sub-make that reads it.
      # This dry-run step logs evidence of which architectures the
      # build system will actually use before the real build runs.
      - name: Show the architectures the build will use
        working-directory: recovered-source/project
        env:
          ARCHS: "arm64 arm64e"
        run: |
          export THEOS=~/theos
          make -n package FINALPACKAGE=1 ARCHS="arm64 arm64e" > /tmp/make-dryrun.txt 2>&1 || true
          echo "arm64e mentions in dry run: $(grep -c arm64e /tmp/make-dryrun.txt || true)"
          grep -m 3 arm64e /tmp/make-dryrun.txt || echo "WARNING: no arm64e found in dry run"

      - name: Run HL8 analyzer regression fixtures
        working-directory: recovered-source/gpt-project-history
        run: python3 -m unittest -v test_analyze_hl8_unified_log.py

      - name: Verify HL22 baseline invariants (reversible keyboard layout, original picker, pinch, Dock)
        run: python3 recovered-source/gpt-project-history/verify_hl21_regression.py

      - name: Verify HL22 baseline keyboard geometry and DEB-original menu source fixtures
        run: python3 recovered-source/gpt-project-history/verify_hl22_geometry.py

      - name: Rebrand the complete source/build tree to DuoCar before compilation
        working-directory: .
        run: python3 recovered-source/gpt-project-history/rebrand_duocar.py

      - name: Build the package (arm64 + arm64e)
        working-directory: recovered-source/project
        env:
          ARCHS: "arm64 arm64e"
        run: |
          export THEOS=~/theos
          make clean
          make package FINALPACKAGE=1 ARCHS="arm64 arm64e"
          ls -la packages/

      # Acceptance: the 6 dylibs and the Prefs bundle binary inside
      # the produced .deb must each be FAT with exactly the arm64 and
      # arm64e slices. The app binary is reported for information.
      - name: Verify FAT slices in the component binaries
        run: |
          VER=$(sed -n 's/^Version:[[:space:]]*//p' recovered-source/project/control | head -1)
          DEB=recovered-source/project/packages/com.chuong.duocar_${VER}_iphoneos-arm64.deb
          ls -la "$DEB"
          rm -rf /tmp/fatcheck && mkdir -p /tmp/fatcheck
          dpkg-deb -x "$DEB" /tmp/fatcheck
          ROOT=/tmp/fatcheck/var/jb
          FAIL=0
          for f in \
            Library/MobileSubstrate/DynamicLibraries/DuoCarCore.dylib \
            Library/MobileSubstrate/DynamicLibraries/DuoCarAppBridge.dylib \
            Library/MobileSubstrate/DynamicLibraries/DuoCarCarProbe.dylib \
            Library/MobileSubstrate/DynamicLibraries/DuoCarSpeedBubble.dylib \
            Library/MobileSubstrate/DynamicLibraries/DuoCarSplitScreen.dylib \
            Library/MobileSubstrate/DynamicLibraries/DuoCarStartupScreen.dylib \
            Library/PreferenceBundles/DuoCarPrefs.bundle/DuoCarPrefs ; do
            INFO=$(lipo -info "$ROOT/$f")
            echo "$f -> $INFO"
            case "$INFO" in
              *"arm64 arm64e"*|*"arm64e arm64"*) : ;;
              *) echo "::error::$f is not FAT arm64+arm64e"; FAIL=1 ;;
            esac
          done
          echo "App binary (informational): $(lipo -info "$ROOT/Applications/DuoCar.app/DuoCar")"
          if [ "$FAIL" -ne 0 ]; then
            echo "::error::FAT verification failed"
            exit 1
          fi
          echo "All required component binaries are FAT (arm64 + arm64e)."

      - name: Verify HL21 legacy picker, removed overlay, HL13 pinch, HL12 Dock, HL11 keyboard
        run: |
          DEB=recovered-source/project/packages/com.chuong.duocar_1.0.3-hl23duocar_iphoneos-arm64.deb
          test "$(dpkg-deb -f "$DEB" Package)" = "com.chuong.duocar"
          test "$(dpkg-deb -f "$DEB" Version)" = "1.0.3-hl23duocar"
          echo "HL13 package: $(dpkg-deb -f "$DEB" Package Version Architecture)"
          shasum -a 256 "$DEB"
          ROOT=/tmp/fatcheck/var/jb/Library/MobileSubstrate/DynamicLibraries
          for dylib in DuoCarSplitScreen DuoCarAppBridge; do
            for arch in arm64 arm64e; do
              THIN="/tmp/hl8-${dylib}-${arch}"
              lipo -thin "$arch" "$ROOT/${dylib}.dylib" -output "$THIN"
              if ! strings "$THIN" | grep -Fq '[hl8diag]'; then
                echo "::error::Missing HL8 marker in $dylib/$arch"
                exit 1
              fi
              echo "HL8 marker PASS $dylib/$arch"
              if [ "$dylib" = "DuoCarAppBridge" ]; then
                for marker in '[hl11kb]' '[hl23-kbphysical]' 'ev=native-fit' 'ev=restore' 'ev=reload-input-views' '[pinch2] trigger=began toggle-sent dir=0'; do
                  if ! strings "$THIN" | grep -F "$marker" >/dev/null; then
                    echo "::error::HL11 keyboard marker $marker missing in $dylib/$arch"
                    exit 1
                  fi
                  echo "HL11 keyboard marker PASS $dylib/$arch: $marker"
                done
              fi
              if [ "$dylib" = "DuoCarSplitScreen" ]; then
                for marker in '[hl13pinch]' 'route=inapp-hosted' 'hostedPinchFallback' 'dock-category' 'dock-readback' 'dock-tap' 'dock-lifecycle' 'active-model' 'dock-category-not-other'; do
                  if ! strings "$THIN" | grep -F "$marker" >/dev/null; then
                    echo "::error::HL12/HL13 marker $marker missing in $dylib/$arch"
                    exit 1
                  fi
                  echo "HL12/HL13 marker PASS $dylib/$arch: $marker"
                done
                for marker in 'native-logo-owned' 'fs-hidden-save' 'fs-hidden-restore' '[hl21-legacy-picker]' '[picker-face]' '[hl21-floating]'; do
                  if ! strings "$THIN" | grep -F "$marker" >/dev/null; then
                    echo "::error::SplitScreen marker $marker missing in $dylib/$arch"
                    exit 1
                  fi
                  echo "HL9 logo marker PASS $dylib/$arch: $marker"
                done
              fi
            done
          done

      - name: Verify exact DuoCar package, app identity, signatures and zero old branding
        run: |
          python3 recovered-source/gpt-project-history/verify_duocar_payload.py \
            recovered-source/project/packages/com.chuong.duocar_1.0.3-hl23duocar_iphoneos-arm64.deb

      # HL23 is a private candidate: do not create a public Release and do
      # not publish to Sileo without device acceptance and authorization.
      - name: Upload the FAT deb
        uses: actions/upload-artifact@v4
        with:
          name: duocar-hl23-fat-deb
          path: recovered-source/project/packages/com.chuong.duocar_1.0.3-hl23duocar_iphoneos-arm64.deb
