name: DuoFace original vs OmniCar actual touch and global-wake route (READ ONLY)
on:
  push:
    branches: [main]
    paths:
      - "scripts/audit_duoface_omnicar_touch_activity_20261024.py"
      - ".github/workflows/audit-duoface-omnicar-touch-activity.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  original-owner-readonly:
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Verify central source-skills ZIPs (GitHub, iOS, test)
        shell: bash
        run: |
          set -euo pipefail
          ROOT='https://raw.githubusercontent.com/chuongnguyen89dn-ui/Gpt-training-/main/skills'
          for name in 01-github-continuity 02-ios-deb-ipa-carplay 05-research-debug-testing; do
            curl -fLsS --retry 3 "$ROOT/$name.zip" -o "$RUNNER_TEMP/$name.zip"
            unzip -t "$RUNNER_TEMP/$name.zip" > /dev/null
            echo "SKILL_ZIP_VERIFIED=$name"
            unzip -p "$RUNNER_TEMP/$name.zip" '*SKILL.md' | head -n 100 || true
          done
      - name: Install package and original ARM64 inspection tools
        shell: bash
        run: |
          set -euo pipefail
          brew install dpkg llvm
          echo "/opt/homebrew/opt/llvm/bin" >> "$GITHUB_PATH"
      - name: Validate exact SHA-pinned original and compiled source logic
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/audit_duoface_omnicar_touch_activity_20261024.py
          python3 -m py_compile scripts/audit_duoface_omnicar_touch_activity_20261024.py
          echo 'd9297b010cdc08e401439b7332413f79cb1a056a05159a5deb673e218d76d9fd  com.anlai.omnicar_1.0.3_iphoneos-arm64.deb' | shasum -a 256 --check
      - name: Disassemble original AppBridge + Split touch owner and classify DuoFace-equivalent event route
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/audit_duoface_omnicar_touch_activity_20261024.py \
            com.anlai.omnicar_1.0.3_iphoneos-arm64.deb \
            --output audit/OmniCar_DuoFace_Original_Touch_IPC_20261024.json
          python3 - <<'PY'
          import json
          a=json.load(open('audit/OmniCar_DuoFace_Original_Touch_IPC_20261024.json'))
          app=a['modules']['OmniCarAppBridge']['owners']['ABHost']
          split=a['modules']['OmniCarSplitScreen']['owners']['SCPCarSplit']
          assert app['outsideTouched']['imp'] and split['bridgeOutsideTouched']['imp']
          assert app['window']['imp'] and split['container']['imp']
          print('ORIGINAL_ABHOST_OUTSIDE_TOUCH_VS_SCPCAR_SPLIT_BRIDGE_CALLBACK_VERIFIED')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: OmniCar-20261024-OriginalTouchRoute-DuoFace-ReadOnly
          path: audit/OmniCar_DuoFace_Original_Touch_IPC_20261024.json
          retention-days: 90
      - name: Archive evidence on Omnicar main without modifying binaries or release
        if: github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add audit/OmniCar_DuoFace_Original_Touch_IPC_20261024.json
          git diff --cached --quiet && exit 0
          git commit -m 'audit: archive original AppBridge outsideTouched and split native touch IPC route [skip ci]'
          for attempt in 1 2 3; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then exit 0; fi
            sleep 2
          done
          exit 1
