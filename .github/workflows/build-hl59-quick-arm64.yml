name: "DC60CL - 37C alert signed arm64-only test"
# HL58 strict UIKit -Werror unused receiver variable removed
# HL58 DATA-manifest comparison now excludes DEBIAN/control staging metadata
# HL58 synthetic fixture root corrected before first actual compilation
permissions:
  contents: read
on:
  push:
    branches:
      - feature/duocar-hl59-quick-arm64-20261114
    paths:
      - .github/workflows/build-hl59-quick-arm64.yml
  workflow_dispatch:

jobs:
  quick-arm64:
    runs-on: macos-15
    timeout-minutes: 55
    steps:
      - name: Checkout HL60 source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Prebuild source and touch/zoom/keyboard contract
        shell: bash
        run: |
          set -euo pipefail
          python3 recovered-source/gpt-project-history/verify_hl58_external_source.py
          cmp recovered-source/project/OmniCarLeExtension/DCLLeExtension.m recovered-source/src/LeExtension/DCLLeExtension.m
          grep -Fq '[hl59-layer]' recovered-source/project/OmniCarLeExtension/DCLLeExtension.m
          python3 recovered-source/gpt-project-history/verify_duocar_vitals_static.py
          python3 recovered-source/gpt-project-history/verify_hl43_shared_telex.py
          sh recovered-source/gpt-project-history/test_hl53_pinch_direction.sh
          sh recovered-source/gpt-project-history/test_le_traffic_core.sh
          clang -std=c11 -Wall -Wextra -Werror -pedantic \
            recovered-source/gpt-project-history/tests/test_hl55_thermal_alarm.c \
            -lm -o /tmp/dc58-thermal
          /tmp/dc58-thermal
          grep -Fq 'duocarThermalTest37Enabled' recovered-source/project/OmniCarApp/OMCNativeSettings.m
          grep -Fq '[hl60-thermal]' recovered-source/project/OmniCarSplitScreen/SCPDeviceVitalsHUD.m
          grep -Fq '[hl60-thermal]' recovered-source/project/OmniCarSplitScreen/SCPFullscreenVitalsBubble.m
          cmp recovered-source/project/OmniCarSplitScreen/SCPFullscreenVitalsBubble.m recovered-source/src/SplitScreenA/SCPFullscreenVitalsBubble.m
          cmp recovered-source/project/OmniCarSplitScreen/SCPDeviceVitalsHUD.m recovered-source/src/SplitScreenA/SCPDeviceVitalsHUD.m
          cmp recovered-source/project/OmniCarApp/OMCNativeSettings.m recovered-source/src/App/OMCNativeSettings.m

      - name: Restore Theos iPhoneOS16.5 SDK cache
        uses: actions/cache@v4
        id: cache-theos
        with:
          path: ~/theos
          key: hl36-theos-ios16-5-${{ runner.os }}-${{ runner.arch }}-v1

      - name: Install Theos and iPhoneOS SDK if absent
        if: steps.cache-theos.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          git clone --recursive https://github.com/theos/theos.git "$HOME/theos"
          git clone --depth 1 --filter=blob:none --sparse https://github.com/theos/sdks.git "$HOME/theos-sdks"
          git -C "$HOME/theos-sdks" sparse-checkout set iPhoneOS16.5.sdk
          mkdir -p "$HOME/theos/sdks"
          cp -R "$HOME/theos-sdks/iPhoneOS16.5.sdk" "$HOME/theos/sdks/"

      - name: Install ldid/dpkg signing tools
        shell: bash
        run: |
          set -euo pipefail
          brew list ldid >/dev/null 2>&1 || brew install ldid
          brew list dpkg >/dev/null 2>&1 || brew install dpkg
          command -v ldid
          command -v dpkg-deb
          dpkg --compare-versions 1.0.4-hl60cl1 gt 1.0.4-hl59cl1
          command -v lipo

      - name: Reject vendor payload in synthetic DuoCar packages
        shell: bash
        run: |
          set -euo pipefail
          python3 recovered-source/gpt-project-history/tests/test_hl58_vendor_free_merge.py

      - name: Normalize disposable macOS linker option
        shell: bash
        run: |
          set -euo pipefail
          find recovered-source/project -type f -name Makefile -print0 |
            xargs -0 grep -l -- '-fuse-ld=lld' | while IFS= read -r file; do
              sed -i '' 's/-fuse-ld=lld//g' "$file"
            done

      - name: Rebrand DuoCar source, strip SpeedBubble legacy
        shell: bash
        run: |
          set -euo pipefail
          python3 recovered-source/gpt-project-history/rebrand_duocar_hl47.py
          python3 recovered-source/gpt-project-history/strip_speedbubble_assets.py recovered-source/project

      - name: Compile signed DuoCar base ARM64 (no original Lề)
        shell: bash
        env:
          ARCHS: arm64
          THEOS_PACKAGE_SCHEME: rootless
        run: |
          set -euo pipefail
          export THEOS="$HOME/theos"
          cd recovered-source/project
          make clean ARCHS=arm64
          make package FINALPACKAGE=1 ARCHS=arm64 2>&1 | tee /tmp/dc60-base.log
          test -s packages/com.chuong.duocar_1.0.3-hl47menudockfat1_iphoneos-arm64.deb

      - name: Compile signed optional 2-function Lề companion ARM64
        shell: bash
        env:
          ARCHS: arm64
          THEOS_PACKAGE_SCHEME: rootless
        run: |
          set -euo pipefail
          export THEOS="$HOME/theos"
          cd recovered-source/project/OmniCarLeExtension
          make clean ARCHS=arm64
          make package FINALPACKAGE=1 ARCHS=arm64 2>&1 | tee /tmp/dc60-companion.log
          test -s packages/com.chuong.duocar.leextension_0.2.0_iphoneos-arm64.deb

      - name: Package ONE DC60CL without Le vendor, fonts, bundle or conflicts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          python3 recovered-source/gpt-project-history/merge_external_le_only.py \
            --duocar recovered-source/project/packages/com.chuong.duocar_1.0.3-hl47menudockfat1_iphoneos-arm64.deb \
            --extension recovered-source/project/OmniCarLeExtension/packages/com.chuong.duocar.leextension_0.2.0_iphoneos-arm64.deb \
            --output dist/DC60CL.deb --version 1.0.4-hl60cl1

      - name: Verify FINAL signed ARM64 without ANY bundled Le content
        shell: bash
        run: |
          set -euo pipefail
          python3 recovered-source/gpt-project-history/verify_hl60_arm64_deb.py dist/DC60CL.deb
          dpkg-deb -f dist/DC60CL.deb
          shasum -a 256 dist/DC60CL.deb

      - name: Upload ONE direct DC60CL.deb
        uses: actions/upload-artifact@v4
        with:
          name: DC60CL-arm64
          path: dist/DC60CL.deb
          if-no-files-found: error
          retention-days: 7

      - name: Preserve rejected binary and logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: DC60CL-build-diagnostics
          path: |
            dist/DC60CL.deb
            /tmp/dc60-base.log
            /tmp/dc60-companion.log
          if-no-files-found: ignore
          retention-days: 3
