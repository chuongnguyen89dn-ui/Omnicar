<text x="41" y="700" fill="#F5F0FF" font-size="16" font-family="Arial">Fullscreen: sau khi vào, logo/vòng/Dock ẩn; pinch-in trở về. Không yêu cầu bấm vòng tròn khi nó đã ẩn.</text>
